# CI for every PR and every push to main.
#
# The full pixel-fidelity harness (npm run prove) needs the Qt reference app
# and can't run on a hosted runner, so CI covers everything that CAN run
# headlessly: the TypeScript typecheck, the production editor build, the
# behavioural regression guards in tools/*_check.mjs, and the Chromium smoke
# tests in tools/ci_smoke.mjs (fixtures render non-empty, the built editor boots
# without page errors). Rendered PNGs are uploaded as a workflow artifact so
# reviewers can eyeball what a PR draws.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: both jobs only check out, build, run checks and upload
# artifacts. Nothing here writes to the repository or calls the API, and
# actions/upload-artifact authenticates with the runtime token rather than
# GITHUB_TOKEN, so read access to contents is the whole requirement.
permissions:
  contents: read

jobs:
  typecheck:
    name: Typecheck (tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      # Regression guards for the ported behaviour. These compile the modules
      # under test with the repo's own tsc and need no browser, so they belong
      # with the typecheck. Each assertion is written to FAIL if its fix is
      # reverted (see the header comment in each tool).
      - name: Guards — angle/length edit geometry
        run: node tools/angle_edit_check.mjs

      - name: Guards — rotate, angle dialog, renderer settings
        run: node tools/tier3_check.mjs

      - name: Guards — colour scopes, arrow + extension data, i18n completeness
        run: node tools/tier4_check.mjs

      # Undo/redo provenance: every history state records what produced it, the
      # record survives undo/redo in both directions, and the stack still
      # restores the same documents it always did.
      - name: Guards — undo/redo state provenance
        run: node tools/history_meta_check.mjs

  build-and-smoke:
    name: Build editor + headless smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Build editor (Vite)
        run: npm run build:editor

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Renderer smoke — fixtures draw non-empty output
        run: >
          node tools/ci_smoke.mjs render
          fixtures/single_strand.json
          fixtures/closed_knot.json
          fixtures/box_stitch.json
          fixtures/three_strand_braid.json
          fixtures/overhand_knot.json
          fixtures/attached_90.json
          fixtures/mask_receiver.json

      # The other two guards drive the real renderer in Chromium, so they run
      # here rather than in the typecheck job.
      - name: Guards — hidden strands stay in the render array
        run: node tools/hidden_strand_check.mjs

      - name: Guards — drag masks, third control point, curvature bias
        run: node tools/curve_and_mask_check.mjs

      # Curvature bias CONTROLS (curvature_bias_control.py): the triangle/circle
      # squares on the centre->cp lines — show/grab gate, grab priority, the
      # pointer->bias projection, undo, save/load, copy/paste, and a real hover +
      # drag against the editor with overlay pixel checks.
      - name: Guards — curvature bias controls
        run: node tools/bias_check.mjs

      - name: Guards — rotate / angle dialog / width dialog reach the canvas
        run: node tools/tier3_ui_check.mjs dist-editor

      - name: Guards — extension rays, arrow textures, arrow shadow
        run: node tools/tier4_ui_check.mjs

      - name: Guards — Tier 5 shadow-path preview overlay
        run: node tools/tier5_check.mjs

      # Body paint. Qt fills each body layer as ONE WindingFill path (band plus
      # caps) rather than a boolean union — OSS moved off QPainterPath.united()
      # because "Qt's Boolean union can discard the body". paper.js's
      # resolveCrossings() fails the same way on a tightly curved strand, which
      # painted the body as a bare stroke-coloured silhouette mid-drag. Also
      # asserts every render entry point derives its paint state from its own
      # meta, so the same document can't render two ways.
      - name: Guards — winding-fill body paint, per-render paint state
        run: node tools/body_paint_check.mjs

      # Control-column zoom buttons: OSS's 10%-of-current step, the [0.1, 5]
      # range the wheel shares, the viewport-centre anchor, and that a press
      # reaches the canvas. Fails outright if the buttons go inert again.
      - name: Guards — zoom buttons
        run: node tools/zoom_check.mjs

      # Drag/release fast path. Behavioural, not timing-based: it asserts the
      # invariants the optimisations rest on (the document is edited in place so
      # the layer panel stays asleep, a coalesced flick still lands on the last
      # reported position, undo/ESC are unaffected, the renderer's geometry memo
      # never outlives a paint, a drag frame allocates no canvas or paper
      # project). Each one fails if its optimisation is reverted.
      - name: Guards — drag/release fast path
        run: node tools/drag_perf_check.mjs

      # Pan: a frame is the retained scene under a moved transform (OSS's
      # painter.translate(pan_offset)) rather than a rebuild, so this checks the
      # properties that makes true — a delta-0 frame reproduces its render exactly,
      # the same frame twice is identical, a frame at delta d is the anchor image
      # shifted by exactly d (residual bounded AND uniquely best at that delta), and
      # a scene is REFUSED for a different scene_key, a missing key, a resize or a
      # zoom change.
      - name: Guards — pan correctness
        run: node tools/pan_fidelity.mjs

      # Canvas cursor + pan button (OSS strand_drawing_canvas.py setCursor calls):
      # one cursor per mode on entry, crosshair in an Edit Mask session, open hand
      # for the hand tool, CLOSED hand for the length of any pan drag with the
      # interrupted cursor restored on release, the layer panel's pan button
      # pressed for a right-drag pan, and no cursor change on hover.
      - name: Guards — canvas cursor and pan button
        run: node tools/cursor_check.mjs

      # Collapsible group column (OSS group_rail.py, PRs #18/#19 there): the
      # column collapses to a 40px rail and the canvas gains exactly that width,
      # the state persists across a reload, the rail mirrors the groups, its
      # create tile follows the language (G / ק), a tile expands and flashes
      # its group, Ctrl+G toggles except under a modal dialog.
      - name: Guards — collapsible group column
        run: node tools/group_rail_check.mjs

      # Layer list scrolling (OSS layer_panel.scroll_area, an AlignBottom
      # QScrollArea): few layers sit at the bottom; once they outgrow the list
      # it scrolls with a scrollbar and the topmost button stays reachable, the
      # buttons keep their width beside the scrollbar, the drop line lands on
      # row edges while scrolled, and the scrollbar goes away with the layers.
      - name: Guards — layer list scrolls
        run: node tools/layer_list_scroll_check.mjs

      # Snap-to-grid settings (OSS settings_dialog General page): the MOVE
      # checkbox gates move-mode drags (with the desktop's zoom/Ctrl decision), the
      # ATTACH/CREATE checkbox gates a new strand's start AND end and a child's end
      # (_get_snapped_attachment_position: snapped, never collapsed onto the start),
      # neither setting leaks into the other mode, and the Move Group dialog's Snap
      # button lands every member endpoint on the grid absolutely.
      - name: Guards — snap-to-grid settings
        run: node tools/snap_check.mjs

      - name: Editor smoke — built app boots cleanly
        run: node tools/ci_smoke.mjs editor dist-editor

      - name: Upload rendered fixtures and guard screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-smoke-renders
          path: |
            artifacts/ci_smoke/
            artifacts/layer_list_scroll/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload editor build
        uses: actions/upload-artifact@v4
        with:
          name: dist-editor
          path: dist-editor/
          retention-days: 7
